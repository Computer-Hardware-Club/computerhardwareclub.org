        - code [ref=f17e70]: "import time def is_prime(n): \"\"\"A very naive and slow way to check for a prime number.\"\"\" if n <= 1: return False # Checks every single number up to n for i in range(2, n): if n % i == 0: return False return True def main(): print(\"Starting Prime Hunt for exactly 1.0 second...\") start_time = time.time() duration = 1.0 prime_count = 0 current_number = 2 # Run the loop until 1 second has passed while (time.time() - start_time) < duration: if is_prime(current_number): prime_count += 1 current_number += 1 print(\"\\n--- TIME'S UP! ---\") print(f\"Total primes found: {prime_count}\") print(f\"Highest number checked: {current_number - 1}\") if __name__ == \"__main__\": main()"
