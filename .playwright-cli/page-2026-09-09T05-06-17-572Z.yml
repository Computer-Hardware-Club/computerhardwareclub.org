          - generic [ref=f62e41]:
            - paragraph [ref=f62e42]:
              - strong [ref=f62e43]: "Analogy:"
              - text: "\"Administrator Mode\" or \"Simon Says\"."
            - paragraph [ref=f62e44]: Linux protects system files (like web configs) from accidental damage. If you try to edit them as a normal user, it will say "Permission Denied."
            - paragraph [ref=f62e45]:
              - text: Typing
              - code [ref=f62e46]: sudo
              - text: "before a command tells the computer: \"I know what I'm doing, do it anyway.\""
          - generic [ref=f62e47]: "# Edit a protected file sudo nano /etc/hosts # Install software sudo apt install nginx"
        - generic [ref=f62e48]:
          - heading "Services (systemctl)" [level=3] [ref=f62e49]
          - generic [ref=f62e53]:
            - paragraph [ref=f62e54]:
              - strong [ref=f62e55]: "Analogy:"
              - text: A restaurant kitchen.
            - paragraph [ref=f62e56]:
              - text: Most programs stop when you close them. "Services" (or Daemons) run in the background forever, waiting for customers (web visitors). You control them with
              - code [ref=f62e57]: systemctl
              - text: .
            - paragraph [ref=f62e58]:
              - text: "Important: If you change a config file, the service won't know until you"
              - strong [ref=f62e59]: restart
              - text: it!
          - generic [ref=f62e60]:
            - generic [ref=f62e61]: "# Is it running or dead? systemctl status nginx"
            - generic [ref=f62e62]: "# Apply your changes sudo systemctl restart nginx"
