              - text: "Every file has 3 rights:"
              - strong [ref=f62e72]: R
              - text: ead (4),
              - strong [ref=f62e73]: W
              - text: rite (2), e
              - strong [ref=f62e74]: X
              - text: ecute (1).
            - paragraph [ref=f62e75]: "Permissions are often shown as numbers:"
            - list [ref=f62e76]:
              - listitem [ref=f62e77]:
                - code [ref=f62e78]: "7"
                - text: (4+2+1) = Read, Write, Execute
